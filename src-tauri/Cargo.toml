[package]
name = "seren"
version = "0.1.0"
description = "DeskPet4OpenClaw — Live2D Desktop Pet with OpenClaw AI"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-localhost = "2"
portpicker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-notification = "2.3.3"
base64 = "0.22"
